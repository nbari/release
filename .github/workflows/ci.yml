name: CI
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main, develop, sandbox]
  workflow_dispatch:
    inputs:
      cargo-adapter:
        description: Run optional Cargo adapter fixture tests
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Framework verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install test tooling
        run: bash tests/setup-ci.sh
      - name: Check Action metadata
        run: just action-metadata-test
      - name: Validate this repository using its root Action
        uses: ./
        id: framework
      - name: Validate a separate shell project
        uses: ./
        id: shell
        with:
          project-directory: examples/shell
          adapter: tools/adapter.sh
      - name: Assert runtime and consumer identity
        env:
          FRAMEWORK: ${{ steps.framework.outputs.project }}
          SHELL_RESULT: ${{ steps.shell.outputs.validation-json }}
          RUNTIME: ${{ steps.shell.outputs.runtime-revision }}
        run: |
          test "$FRAMEWORK" = release
          test "$RUNTIME" = "$GITHUB_SHA"
          printf '%s' "$SHELL_RESULT" | jq -e '.project == "hello" and .adapter_executed == false'
      - name: Framework failure-injection tests without application toolchains
        run: just check
  cargo-adapter:
    name: Optional Cargo adapter compatibility
    if: github.event_name == 'workflow_dispatch' && inputs.cargo-adapter
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: bash tests/adapters/test-cargo.sh
  ci-ok:
    name: CI OK
    if: always()
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULT: ${{ needs.verify.result }}
        run: test "$RESULT" = success
